<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Halaman Tidak Ditemukan | TEKSA</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-screen {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }
    .error-code {
      font-family: var(--font-display);
      font-size: clamp(72px, 18vw, 140px);
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1;
    }
    .error-terminal {
      font-size: 15px;
      color: var(--text-secondary);
      margin-top: 16px;
      max-width: 420px;
    }
  </style>
</head>
<body>

  <div class="statusbar">
    <div class="statusbar__inner">
      <span class="statusbar__ping"><span class="statusbar__dot" style="background: var(--accent-red); box-shadow: 0 0 8px var(--accent-red);"></span> Halaman tidak ditemukan</span>
    </div>
  </div>

  <nav class="navbar">
    <div class="navbar__inner">
      <a href="index.html" class="navbar__brand">
        <span class="navbar__brand-badge"><img src="assets/logo.png" alt="Logo TEKSA"></span>
        TEKSA <span>· X TKJ 1</span>
      </a>
    </div>
  </nav>

  <main>
    <div class="error-screen">
      <div class="error-code">404</div>
      <div class="error-terminal">
        <p>Halaman yang kamu cari tidak ditemukan.</p>
        <p class="mt-8">Mungkin sudah dipindah, dihapus, atau memang belum pernah ada.</p>
      </div>
      <div class="btn-row mt-32">
        <a href="index.html" class="btn btn--primary">Kembali ke Home</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <span>&copy; 2026 TEKSA — X TKJ 1 SMKN 1 Tanjunganom</span>
      <span>Made by <span class="footer__creator">&lt;creator&gt;</span></span>
    </div>
  </footer>

</body>
</html>
